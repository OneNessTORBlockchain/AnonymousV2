# proxychains-ng configuration mounted into av2-kali at /etc/proxychains4.conf.
#
# Tools that read *_PROXY (curl, wget, sqlmap, python-requests) are already
# proxied by app/core/sandbox.py.  Tools that open raw sockets - nmap, masscan,
# whatweb, sqlmap's --tor-less paths - only leave through Tor when started as:
#
#   proxychains4 nmap -sT -Pn -T4 <target>      # -sT: SOCKS has no raw SYN
#   proxychains4 -q whatweb <target>
#
# 10.213.77.2 is the av2-tor sidecar on av2-net (compose pins it); proxychains
# wants a numeric address here.

strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5  10.213.77.2  9050